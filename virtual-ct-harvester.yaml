# Virtual CT Harvester for the LILYGO T3 LoRa32 V1.6.1 (ESP32 and SX1276,
# 868 MHz variant).
# Pairs with a Zappi as a virtual Harvi and sends three power readings as
# CT1-CT3. The readings come from Home Assistant or are pushed over HTTP. The
# device tracks the Zappi's mains phase in a closed loop from the Zappi's own
# radio status broadcasts. The radio profile, pairing, and CT output are
# verified over the air.
external_components:
  - source:
      type: local
      path: components
    components: [sx127x, harvi_core, harvester_ui]

harvi_core:
  serial: !secret virtual_harvi_serial

packages:
  power_inputs: !include packages/power-inputs.yaml
  commissioning: !include packages/commissioning.yaml
  web_app: !include packages/web-app.yaml

esphome:
  name: !secret device_name
  friendly_name: Virtual CT Harvester
  min_version: 2026.9.0
  project:
    name: imduffy15.virtual-ct-harvester
    version: "1.0.0"
  on_boot:
    # Restored globals load at priority 800, before this runs.
    - priority: 700
      then:
        - lambda: |-
            if (harvi::valid_serial(id(serial_override))) harvi::SERIAL = id(serial_override);
    - priority: -100
      then:
        - lambda: |-
            if (id(radio).is_failed()) {
              id(gateway_status).publish_state("Radio failed: check the board variant and pins");
              return;
            }
            ESP_LOGI("harvi", "Virtual serial=%lu, reference serial=%lu, SX127x version=0x%02x",
                     (unsigned long) harvi::SERIAL, (unsigned long) id(reference_serial).state,
                     id(radio).diagnostic_register(0x42));
            if (id(stored_frequency) == 0) {
              id(start_scan).execute();
            } else {
              id(radio).set_frequency(id(stored_frequency));
              id(radio).configure();
              for (size_t i=0; i<harvi::FREQUENCIES.size(); ++i)
                if (harvi::FREQUENCIES[i] == id(stored_frequency)) id(receive_frequency).publish_state(i);
              id(gateway_status).publish_state("Listening");
            }

esp32:
  board: ttgo-lora32-v21
  framework:
    type: esp-idf

wifi:
  id: wifi_connection
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: !secret setup_ap_ssid
    password: !secret setup_password
    ap_timeout: 10s

logger:
  level: INFO
  tx_buffer_size: 1024

api:
  encryption:
    key: !secret harvi_radio_api_key
  reboot_timeout: 0s
  on_client_disconnected:
    - lambda: id(inputs).reset();

# Updates are encrypted and authenticated with the API encryption key.
ota:
  - platform: esphome
    encryption: {}

spi:
  clk_pin: GPIO5
  miso_pin: GPIO19
  mosi_pin: GPIO27

globals:
  - id: rx_count
    type: uint32_t
    initial_value: '0'
  - id: last_rx_ms
    type: uint32_t
    initial_value: '0'
  - id: rx_restarts
    type: uint32_t
    initial_value: '0'
  # Device byte of the Zappi that lists this virtual Harvi (-1 until heard).
  - id: zappi_device
    type: int16_t
    restore_value: true
    initial_value: '-1'
  - id: zappi_serial
    type: uint32_t
    restore_value: true
    initial_value: '0'
  # Virtual serial set by the owner. 0 uses the built-in serial
  # (harvi::BUILT_IN_SERIAL).
  - id: serial_override
    type: uint32_t
    restore_value: true
    initial_value: '0'

# Candidate frequencies, not verified channel assignments. The default is
# candidate 1. A string selector avoids single-precision float rounding at
# 869 MHz.
select:
  - platform: template
    id: receive_frequency
    name: Receive frequency
    internal: true
    options:
      - "869534852 Hz - candidate 1"
      - "869555000 Hz - candidate 2"
      - "869795000 Hz - candidate 3"
      - "869901063 Hz - candidate 4"
      - "868095000 Hz - candidate 5"
      - "868231667 Hz - candidate 6"
      - "868368333 Hz - candidate 7"
      - "868505000 Hz - candidate 8"
    initial_option: "869534852 Hz - candidate 1"
    restore_value: false
    optimistic: true
    set_action:
      - lambda: |-
          id(scan_state).stop();
          id(pair_state).stop();
          id(virtual_ct).stop();
          const uint32_t frequency = strtoul(x.c_str(), nullptr, 10);
          id(stored_frequency) = frequency;
          id(radio).set_frequency(frequency);
          id(radio).configure();
          ESP_LOGI("harvi_rx", "Receiver retuned to %lu Hz", (unsigned long) frequency);
          id(gateway_status).publish_state("Listening");

sensor:
  - platform: uptime
    id: uptime_s
    name: Uptime
    entity_category: diagnostic
    disabled_by_default: true
  - platform: wifi_signal
    id: wifi_rssi
    name: Wi-Fi signal
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 30s
  # SX1276 FSK RegRssiValue is -value/2 dBm. Sampled between packets, it shows
  # the channel noise floor.
  - platform: template
    id: noise_floor
    name: Radio noise floor
    entity_category: diagnostic
    disabled_by_default: true
    unit_of_measurement: dBm
    device_class: signal_strength
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      if (id(radio).is_failed()) return NAN;
      return -0.5f * id(radio).diagnostic_register(0x11);

text_sensor:
  - platform: template
    id: last_packet
    name: Last radio packet
    internal: true
    update_interval: never
  - platform: template
    id: last_harvi
    name: Last candidate Harvi packet
    internal: true
    update_interval: never

sx127x:
  id: radio
  cs_pin: GPIO18
  rst_pin: GPIO23
  dio0_pin: GPIO26
  frequency: 869534852Hz
  modulation: FSK
  bitrate: 76739
  deviation: 40000Hz
  bandwidth: 83_3kHz
  shaping: NONE
  bitsync: true
  packet_mode: true
  payload_length: 0
  crc_enable: true
  sync_value: [0x69, 0x81, 0x7e, 0x96]
  preamble_size: 3
  preamble_detect: 2
  preamble_errors: 10
  preamble_polarity: 0xAA
  rx_start: true
  # Transmit power is 14 dBm (25 mW; the 869.40-869.65 MHz sub-band allows
  # 500 mW at 10 % duty). Pairing sends one packet every 2 s for 120 s.
  # Virtual CT output sends one packet of about 4 ms for each Zappi status
  # heard (about 0.4 % duty). At 2 dBm a path change of about 3 dB stopped the
  # Zappi taking up most packets for over an hour.
  pa_pin: BOOST
  pa_power: 14
  on_packet:
    then:
      - lambda: |-
          // Reconstruct the FIFO length for raw packet logs.
          // The ISR edge time marks a radio event. It isn't a mains phase reference.
          if (x.empty() || x.size() > 63) return;
          ++id(rx_count);
          id(last_rx_ms) = millis();
          char hex[129];
          static const char digits[] = "0123456789abcdef";
          hex[0] = digits[x.size() >> 4];
          hex[1] = digits[x.size() & 15];
          for (size_t i = 0; i < x.size(); ++i) {
            hex[2 + i * 2] = digits[x[i] >> 4];
            hex[3 + i * 2] = digits[x[i] & 15];
          }
          hex[2 + x.size() * 2] = 0;
          char record[240];
          const uint32_t freq = id(scan_state).active ? harvi::FREQUENCIES[id(scan_state).index] :
              (id(stored_frequency) ? id(stored_frequency) : harvi::FREQUENCIES[id(scan_state).index]);
          snprintf(record, sizeof(record), "ms=%lu irq_us=%lu n=%lu hz=%lu fifo=%s",
                   (unsigned long) millis(), (unsigned long) id(radio).get_last_irq_us(),
                   (unsigned long) id(rx_count), (unsigned long) freq, hex);
          id(last_packet).publish_state(record);
          ESP_LOGI("harvi_rx", "%s", record);
          // In ESPHome 2026.9.0, the FSK RSSI and SNR arguments are always zero
          // placeholders. Don't expose them as measurements.
          harvi::ZappiStatus status;
          if (harvi::parse_zappi_status(x, status)) {
            if (id(scan_state).observe_zappi(status)) {
              id(stored_frequency) = harvi::FREQUENCIES[id(scan_state).index];
              id(gateway_status).publish_state("Found the Zappi's channel");
              ESP_LOGI("harvi", "Zappi broadcasts found at %lu Hz", (unsigned long) id(stored_frequency));
            }
            // Learn this installation's Zappi from the record it keeps for this
            // virtual Harvi, and ignore frames from neighboring installations.
            if (status.type == 0x3730 && status.harvi_serial == harvi::SERIAL &&
                (status.device != id(zappi_device) || status.zappi_serial != id(zappi_serial))) {
              id(zappi_device) = status.device;
              id(zappi_serial) = status.zappi_serial;
              ESP_LOGI("harvi", "Zappi %lu (device byte 0x%02x) lists this virtual Harvi",
                       (unsigned long) status.zappi_serial, status.device);
            }
            if (status.device != id(zappi_device)) return;
            const uint32_t rx_us = id(radio).get_last_irq_us();
            const bool observed = id(virtual_ct).on_status(status, rx_us);
            if (status.type == 0x3601) {
              ESP_LOGI("harvi_zappi", "rx_us=%lu grid_w=%ld gen_w=%ld", (unsigned long) rx_us,
                       (long) status.grid_w, (long) status.generation_w);
            } else if (status.type == 0x5a5a) {
              ESP_LOGI("harvi_zappi", "rx_us=%lu v_dv=%u f_chz=%u", (unsigned long) rx_us,
                       status.voltage_dv, status.frequency_chz);
            } else if (status.type == 0x3730) {
              ESP_LOGI("harvi_zappi", "rx_us=%lu harvi=%lu p=%d,%d,%d i=%d,%d,%d", (unsigned long) rx_us,
                       (unsigned long) status.harvi_serial, status.ct_power_w[0], status.ct_power_w[1],
                       status.ct_power_w[2], status.ct_current_ca[0], status.ct_current_ca[1], status.ct_current_ca[2]);
            }
            if (observed) {
              const auto &t = id(virtual_ct).tracker();
              const auto &f = id(virtual_ct).fit();
              ESP_LOGI("harvi_pll", "obs=%lu locked=%u tracking=%u sd=%.1f nis=%.2f f=%.4f fit_n=%u fit_f=%.4f fit_gain=%.3f fit_rel=%.3f",
                       (unsigned long) id(virtual_ct).observations, unsigned(id(virtual_ct).locked()),
                       unsigned(t.tracking()), t.tracking() ? t.phase_sigma_deg() : 0.0, id(virtual_ct).nis_avg(),
                       t.frequency_hz(), f.n, f.frequency_hz, f.gain, f.rms_rel);
            }
            return;
          }
          harvi::Packet decoded;
          if (!harvi::decode_payload(x, decoded)) return;
          ++id(valid_harvi_count);
          if (id(scan_state).observe(decoded)) {
            id(stored_frequency) = harvi::FREQUENCIES[id(scan_state).index];
            id(gateway_status).publish_state("Found your Harvi's channel");
            ESP_LOGI("harvi", "Reference Harvi found at %lu Hz", (unsigned long) id(stored_frequency));
          }
          if (x.size() < 7) return;
          std::vector<uint8_t> p(x.size() + 1);
          p[0] = x.size();
          for (size_t i = 1; i < p.size(); ++i) p[i] = x[i - 1] ^ (0x7f - i);
          const uint16_t type = p[2] | (uint16_t(p[3]) << 8);
          if ((type & 0x7fff) != 0x40a5) return;
          const uint32_t serial = p[1] | (uint32_t(p[4]) << 8) | (uint32_t(p[5]) << 16);
          size_t needed = 8;
          for (unsigned ch = 1; ch <= 3; ++ch) if (p[7] & (1 << ch)) needed += 6;
          if (p.size() < needed) return;
          char summary[150];
          snprintf(summary, sizeof(summary), "serial=%lu seq=%u flags=0x%02x type=0x%04x uncalibrated",
                   (unsigned long) serial, p[6], p[7], type);
          id(last_harvi).publish_state(summary);
          ESP_LOGI("harvi_rx", "Candidate %s", summary);
          size_t offset = 8;
          for (unsigned ch = 1; ch <= 3; ++ch) {
            if (!(p[7] & (1 << ch))) continue;
            const uint16_t timing = p[offset] | (uint16_t(p[offset + 1]) << 8);
            const int16_t real = int16_t(p[offset + 2] | (uint16_t(p[offset + 3]) << 8));
            const int16_t imaginary = int16_t(p[offset + 4] | (uint16_t(p[offset + 5]) << 8));
            ESP_LOGI("harvi_rx", "CT%u timing_raw=%u real_raw=%d imaginary_raw=%d",
                     ch, timing, real, imaginary);
            offset += 6;
          }
