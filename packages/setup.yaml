# Per-device credentials are prepared by the builder, never by the end user.
captive_portal:

web_server:
  port: 80
  version: 3
  local: true
  log: false
  auth:
    type: digest
    username: admin
    password: !secret setup_password

number:
  - platform: template
    id: reference_serial
    name: Reference Harvi Serial
    entity_category: config
    min_value: 0
    max_value: 16777215
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0
  - platform: template
    id: input_timeout
    name: Input Receipt Timeout
    entity_category: config
    unit_of_measurement: s
    min_value: 10
    max_value: 3600
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 120

button:
  - platform: template
    name: Apply Input Settings and Restart
    entity_category: config
    on_press:
      - if:
          condition:
            lambda: return harvi::valid_entity_id(id(source_1).state) && harvi::valid_entity_id(id(source_2).state) && harvi::valid_entity_id(id(source_3).state);
          then:
            - script.execute: apply_input_settings
          else:
            - lambda: id(gateway_status).publish_state("Invalid entity ID; use sensor.name or leave blank");
  - platform: factory_reset
    id: reset_device
    internal: true

script:
  - id: apply_input_settings
    then:
      - lambda: |-
          id(pair_state).stop();
          id(gateway_status).publish_state("Saving input settings; restarting");
      - delay: 1s
      - lambda: |-
          esphome::global_preferences->sync();
          esphome::App.safe_reboot();

text_sensor:
  - platform: wifi_info
    ip_address:
      id: device_ip
      name: Device IP Address
      entity_category: diagnostic
  - platform: template
    name: Measurement Status
    update_interval: 60s
    lambda: return {"CT measurements disabled; reception and pairing tests only"};

text:
  - platform: template
    id: source_1
    name: Power 1 Entity
    entity_category: config
    mode: text
    min_length: 0
    max_length: 128
    pattern: '(|sensor\.[a-z0-9_]+)'
    optimistic: true
    restore_value: true
    initial_value: ""
    set_action:
      - lambda: id(gateway_status).publish_state("Input settings changed; press Apply Input Settings and Restart");
  - platform: template
    id: source_2
    name: Power 2 Entity
    entity_category: config
    mode: text
    min_length: 0
    max_length: 128
    pattern: '(|sensor\.[a-z0-9_]+)'
    optimistic: true
    restore_value: true
    initial_value: ""
    set_action:
      - lambda: id(gateway_status).publish_state("Input settings changed; press Apply Input Settings and Restart");
  - platform: template
    id: source_3
    name: Power 3 Entity
    entity_category: config
    mode: text
    min_length: 0
    max_length: 128
    pattern: '(|sensor\.[a-z0-9_]+)'
    optimistic: true
    restore_value: true
    initial_value: ""
    set_action:
      - lambda: id(gateway_status).publish_state("Input settings changed; press Apply Input Settings and Restart");

select:
  - platform: template
    id: source_1_units
    name: Power 1 Source Unit
    entity_category: config
    options: [W, kW]
    optimistic: true
    restore_value: true
    initial_option: W
    set_action:
      - lambda: id(gateway_status).publish_state("Input settings changed; press Apply Input Settings and Restart");
  - platform: template
    id: source_2_units
    name: Power 2 Source Unit
    entity_category: config
    options: [W, kW]
    optimistic: true
    restore_value: true
    initial_option: W
    set_action:
      - lambda: id(gateway_status).publish_state("Input settings changed; press Apply Input Settings and Restart");
  - platform: template
    id: source_3_units
    name: Power 3 Source Unit
    entity_category: config
    options: [W, kW]
    optimistic: true
    restore_value: true
    initial_option: W
    set_action:
      - lambda: id(gateway_status).publish_state("Input settings changed; press Apply Input Settings and Restart");
