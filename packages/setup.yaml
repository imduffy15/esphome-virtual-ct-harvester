# The device builder prepares the per-device credentials. The end user never
# handles them.
captive_portal:

web_server:
  port: 80
  version: 3
  local: true
  log: false
  auth:
    type: digest
    username: admin
    password: !secret setup_password

number:
  - platform: template
    id: reference_serial
    name: Reference Harvi serial
    entity_category: config
    min_value: 0
    max_value: 16777215
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0
  - platform: template
    id: input_timeout
    name: Input receipt timeout
    entity_category: config
    unit_of_measurement: s
    min_value: 10
    max_value: 3600
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 120

button:
  - platform: template
    name: Apply input settings and restart
    entity_category: config
    on_press:
      - if:
          condition:
            lambda: return harvi::valid_entity_id(id(source_1).state) && harvi::valid_entity_id(id(source_2).state) && harvi::valid_entity_id(id(source_3).state);
          then:
            - script.execute: apply_input_settings
          else:
            - lambda: id(gateway_status).publish_state("Invalid entity ID. Use sensor.name or leave it blank.");
  - platform: factory_reset
    id: reset_device
    internal: true

script:
  - id: apply_input_settings
    then:
      - lambda: |-
          id(pair_state).stop();
          id(gateway_status).publish_state("Saving input settings and restarting");
      - delay: 1s
      - lambda: |-
          esphome::global_preferences->sync();
          esphome::App.safe_reboot();

text_sensor:
  - platform: wifi_info
    ip_address:
      id: device_ip
      name: Device IP address
      entity_category: diagnostic
  - platform: template
    name: Measurement status
    update_interval: 5s
    lambda: |-
      return {!id(virtual_ct_output).state ? "Virtual CT output off" :
              id(virtual_ct).locked() ? "CT1-CT3 live" :
              id(virtual_ct).riding() ? "CT1-CT3 held on last phase" : "CT1/CT3 withheld until phase lock"};

text:
  - platform: template
    id: source_1
    name: Power 1 entity
    entity_category: config
    mode: text
    min_length: 0
    max_length: 128
    pattern: '(|sensor\.[a-z0-9_]+)'
    optimistic: true
    restore_value: true
    initial_value: ""
    set_action:
      - lambda: id(gateway_status).publish_state("Input settings changed. Click Apply input settings and restart.");
  - platform: template
    id: source_2
    name: Power 2 entity
    entity_category: config
    mode: text
    min_length: 0
    max_length: 128
    pattern: '(|sensor\.[a-z0-9_]+)'
    optimistic: true
    restore_value: true
    initial_value: ""
    set_action:
      - lambda: id(gateway_status).publish_state("Input settings changed. Click Apply input settings and restart.");
  - platform: template
    id: source_3
    name: Power 3 entity
    entity_category: config
    mode: text
    min_length: 0
    max_length: 128
    pattern: '(|sensor\.[a-z0-9_]+)'
    optimistic: true
    restore_value: true
    initial_value: ""
    set_action:
      - lambda: id(gateway_status).publish_state("Input settings changed. Click Apply input settings and restart.");

select:
  - platform: template
    id: source_1_units
    name: Power 1 source unit
    entity_category: config
    options: [W, kW]
    optimistic: true
    restore_value: true
    initial_option: W
    set_action:
      - lambda: id(gateway_status).publish_state("Input settings changed. Click Apply input settings and restart.");
  - platform: template
    id: source_2_units
    name: Power 2 source unit
    entity_category: config
    options: [W, kW]
    optimistic: true
    restore_value: true
    initial_option: W
    set_action:
      - lambda: id(gateway_status).publish_state("Input settings changed. Click Apply input settings and restart.");
  - platform: template
    id: source_3_units
    name: Power 3 source unit
    entity_category: config
    options: [W, kW]
    optimistic: true
    restore_value: true
    initial_option: W
    set_action:
      - lambda: id(gateway_status).publish_state("Input settings changed. Click Apply input settings and restart.");
  - platform: template
    id: source_1_sign
    name: Power 1 sign
    entity_category: config
    options: [As received, Inverted]
    optimistic: true
    restore_value: true
    initial_option: As received
    set_action:
      - lambda: id(gateway_status).publish_state("Input settings changed. Click Apply input settings and restart.");
  - platform: template
    id: source_2_sign
    name: Power 2 sign
    entity_category: config
    options: [As received, Inverted]
    optimistic: true
    restore_value: true
    initial_option: As received
    set_action:
      - lambda: id(gateway_status).publish_state("Input settings changed. Click Apply input settings and restart.");
  - platform: template
    id: source_3_sign
    name: Power 3 sign
    entity_category: config
    options: [As received, Inverted]
    optimistic: true
    restore_value: true
    initial_option: As received
    set_action:
      - lambda: id(gateway_status).publish_state("Input settings changed. Click Apply input settings and restart.");
