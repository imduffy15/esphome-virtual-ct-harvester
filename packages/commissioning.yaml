globals:
  - id: pair_state
    type: harvi::Pairing
  - id: scan_state
    type: harvi::Scan
  - id: virtual_ct
    type: harvi::VirtualCT
  # Overall state for the Status entity, OLED and web page (the 500 ms interval).
  - id: device_state
    type: int
    initial_value: '-1'
  - id: state_since_ms
    type: uint32_t
    initial_value: '0'
  - id: notice_ms
    type: uint32_t
    initial_value: '0'
  - id: stored_frequency
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: valid_harvi_count
    type: uint32_t
    initial_value: '0'

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

font:
  - file: fonts/DejaVuSansMono.ttf
    id: status_font
    size: 10

display:
  - platform: ssd1306_i2c
    model: SSD1306 128x64
    address: 0x3C
    update_interval: 1s
    lambda: |-
      it.print(0, 0, id(status_font), "Virtual CT Harvester");
      if (!id(wifi_connection).is_connected()) {
        it.print(0, 14, id(status_font), "Wi-Fi setup:");
        it.print(0, 26, id(status_font), "join the network on");
        it.print(0, 38, id(status_font), "the card, then open");
        it.print(0, 50, id(status_font), "192.168.4.1");
        return;
      }
      it.print(0, 14, id(status_font), id(status_text).state.c_str());
      if (id(pair_state).active)
        it.printf(0, 26, id(status_font), "Confirm %lu", (unsigned long) harvi::SERIAL);
      else
        it.printf(0, 26, id(status_font), "Serial %lu", (unsigned long) harvi::SERIAL);
      it.printf(0, 38, id(status_font), "Readings: %s",
                id(inputs).usable(millis(), uint32_t(id(input_timeout).state * 1000)) ? "ok" : "waiting");
      it.printf(0, 50, id(status_font), "%s", id(device_ip).state.c_str());

script:
  - id: start_scan
    then:
      - lambda: |-
          if (id(radio).is_failed()) return;
          if (uint32_t(id(reference_serial).state) == harvi::SERIAL) {
            id(gateway_status).publish_state("Reference Harvi serial must differ from this device's serial");
            return;
          }
          id(pair_state).stop();
          id(virtual_ct).stop();
          id(scan_state).reference_serial = uint32_t(id(reference_serial).state);
          id(scan_state).start(millis());
          id(radio).set_frequency(harvi::FREQUENCIES[0]);
          id(radio).configure();
          id(receive_frequency).publish_state(size_t(0));
          id(gateway_status).publish_state(id(scan_state).reference_serial ?
              "Searching for your Harvi" : "Searching for the Zappi");
  - id: start_pairing
    then:
      - lambda: |-
          if (id(radio).is_failed()) {
            id(gateway_status).publish_state("Can't pair: radio fault");
            return;
          }
          if (id(scan_state).active || id(stored_frequency) == 0) {
            id(gateway_status).publish_state("Can't pair yet: find the Zappi's channel first");
            return;
          }
          id(virtual_ct).stop();
          id(pair_state).start(millis());
          id(gateway_status).publish_state("Pairing: confirm serial " +
              std::to_string(harvi::SERIAL) + " on the Zappi");
          ESP_LOGI("harvi", "Pairing as serial %lu for 120 s. Pairing packets carry no CT readings.",
                   (unsigned long) harvi::SERIAL);
  - id: stop_pairing
    then:
      - lambda: |-
          id(pair_state).stop();
          id(gateway_status).publish_state("Pairing stopped");

button:
  - platform: template
    name: Start pairing
    icon: mdi:link-variant
    entity_category: config
    on_press:
      - script.execute: start_pairing

switch:
  # Continuous virtual CT output. CT1 and CT3 are sent only while the phase is
  # locked. CT2 (Generation on the Zappi) always carries the quadrature pilot.
  - platform: template
    id: virtual_ct_output
    name: Send to Zappi
    icon: mdi:transmission-tower-export
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: ESP_LOGW("harvi", "Virtual CT output enabled");
    on_turn_off:
      - lambda: |-
          id(virtual_ct).stop();
          id(gateway_status).publish_state("Output turned off");
  # Turn on only when no other device has a Grid CT on the Zappi. The grid
  # total then reflects this virtual Harvi alone and adds phase feedback.
  - platform: template
    id: grid_feedback
    name: Grid total is virtual only
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

binary_sensor:
  - platform: gpio
    id: boot_button
    internal: true
    pin:
      number: GPIO0
      inverted: true
      mode: INPUT_PULLUP
      ignore_strapping_warning: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_click:
      min_length: 500ms
      max_length: 3s
      then:
        - script.execute: start_pairing
    on_multi_click:
      - timing:
          - ON for at least 10s
        then:
          - button.press: reset_device
  # Live readings are reaching the Zappi (phase locked, or briefly held).
  - platform: template
    name: Zappi link
    device_class: connectivity
    lambda: return id(virtual_ct).locked() || id(virtual_ct).riding();

sensor:
  - platform: template
    name: Phase uncertainty
    icon: mdi:sine-wave
    entity_category: diagnostic
    disabled_by_default: true
    unit_of_measurement: "°"
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      return id(virtual_ct).tracker().tracking() ? id(virtual_ct).tracker().phase_sigma_deg() : NAN;

text_sensor:
  # Last event message (search result, pairing outcome, or fault) for the web
  # page.
  - platform: template
    id: gateway_status
    name: Gateway status
    internal: true
    update_interval: never
    on_value:
      - lambda: id(notice_ms) = millis();
  - platform: template
    id: status_text
    name: Status
    icon: mdi:information-outline
    update_interval: never

interval:
  - interval: 20ms
    then:
      - lambda: |-
          if (id(radio).is_failed()) {
            id(pair_state).stop(); id(virtual_ct).stop(); id(scan_state).stop();
            return;
          }
          const bool was_scanning = id(scan_state).active;
          if (id(scan_state).advance(millis())) {
            const auto index = id(scan_state).index;
            const auto frequency = harvi::FREQUENCIES[index];
            id(radio).set_frequency(frequency); id(radio).configure();
            id(receive_frequency).publish_state(size_t(index));
          } else if (was_scanning && !id(scan_state).active) {
            // After a failed scan, clear the stored frequency so it can't differ
            // from the frequency the receiver is actually tuned to.
            id(stored_frequency) = 0;
            id(gateway_status).publish_state("No Zappi heard on any channel");
          }
          const bool was_pairing = id(pair_state).active;
          auto payload = id(pair_state).next(millis());
          if (!payload.empty()) {
            const auto result = id(radio).transmit_packet(payload);
            const bool ok = result == esphome::sx127x::SX127xError::NONE;
            id(pair_state).complete(ok);
            if (!ok) id(gateway_status).publish_state("Pairing stopped: radio transmit failed");
          } else if (was_pairing && !id(pair_state).active) {
            id(gateway_status).publish_state("Pairing window ended");
          }
          // Receiver watchdog: the Zappi broadcasts every second, so after 10 s
          // of silence, restart RX in case the SX1276 receiver is stuck.
          if (!id(scan_state).active && uint32_t(millis() - id(last_rx_ms)) > 10000) {
            id(last_rx_ms) = millis();
            ++id(rx_restarts);
            ESP_LOGD("harvi_rx", "No packets for 10 s. Restarting the receiver.");
            id(radio).set_mode_standby();
            id(radio).set_mode_rx();
          }
          id(virtual_ct).grid_ct = id(grid_feedback).state ? 0 : -1;
          if (id(virtual_ct_output).state && !id(virtual_ct).active && !id(pair_state).active &&
              !id(scan_state).active && id(stored_frequency) != 0) {
            id(virtual_ct).start(millis());
          }
          // Input N is sent as CTN. An unused input is sent as 0 W. A used input
          // without a usable value withholds all measurements.
          const uint32_t now_ms = millis(), timeout_ms = uint32_t(id(input_timeout).state * 1000);
          const auto &in = id(inputs);
          uint32_t at_us = 0;
          auto ct_payload = id(virtual_ct).next(
              now_ms, micros(), in.watts(0, now_ms, timeout_ms), in.watts(1, now_ms, timeout_ms),
              in.watts(2, now_ms, timeout_ms), in.usable(now_ms, timeout_ms), at_us);
          if (!ct_payload.empty()) {
            const auto result = id(radio).transmit_packet_at(ct_payload, at_us);
            const bool ok = result == esphome::sx127x::SX127xError::NONE;
            const bool late = result == esphome::sx127x::SX127xError::LATE;
            id(virtual_ct).complete(ok, late, id(radio).get_last_tx_us());
            if (ok) {
              const auto &s = id(virtual_ct).last_sent();
              ESP_LOGI("harvi_tx", "t_us=%lu write_us=%lu rot=%u out=%u ride=%u v_dv=%u a=%.1f,%.1f,%.1f m=%.0f,%.0f,%.0f",
                       (unsigned long) s.t_us, (unsigned long) id(radio).get_last_tx_write_us(), unsigned(s.rotated),
                       unsigned(s.output), unsigned(s.riding),
                       id(virtual_ct).voltage_dv(), s.angle_deg[0], s.angle_deg[1], s.angle_deg[2],
                       s.magnitude_w[0], s.magnitude_w[1], s.magnitude_w[2]);
            } else if (!late) {
              id(gateway_status).publish_state("Output stopped: radio transmit failed");
            }
          }
  - interval: 500ms
    then:
      - lambda: |-
          // Overall state, most important first. Keep the texts in the same order.
          const auto &ct = id(virtual_ct);
          const int now = id(radio).is_failed() ? 0 : id(scan_state).active ? 1 : id(pair_state).active ? 2 :
              id(stored_frequency) == 0 ? 3 : !id(virtual_ct_output).state ? (id(zappi_serial) ? 5 : 4) :
              !ct.active || id(zappi_device) < 0 ? 6 : ct.invalid_input() ? 7 :
              ct.locked() ? 10 : ct.riding() ? 9 : 8;
          if (now == id(device_state)) return;
          id(device_state) = now;
          id(state_since_ms) = millis();
          static const char *const text[] = {"Radio fault", "Searching for Zappi", "Pairing",
              "Zappi not found", "Not paired", "Output off", "Waiting for Zappi", "Waiting for readings",
              "Locking on", "Live (holding)", "Live"};
          id(status_text).publish_state(text[now]);
  - interval: 5s
    then:
      - lambda: |-
          const uint32_t now = millis(), timeout = uint32_t(id(input_timeout).state * 1000);
          ESP_LOGI("harvi_inputs", "ms=%lu usable=%u input_1_w=%.1f input_2_w=%.1f input_3_w=%.1f",
              (unsigned long) now, unsigned(id(inputs).usable(now, timeout)), id(inputs).watts(0, now, timeout),
              id(inputs).watts(1, now, timeout), id(inputs).watts(2, now, timeout));
